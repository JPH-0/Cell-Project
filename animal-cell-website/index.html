<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal Cell</title>
<meta name="description" content="An interactive 3D animal cell by Joseph. Cut it in half, explore the inside, and tap the glowing dots to learn what each part does.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #060a16;
    --bg-2: #12203f;
    --panel: rgba(12, 18, 38, 0.78);
    --line: rgba(160, 190, 255, 0.18);
    --text: #eef2ff;
    --muted: #a6b0d0;
    --orange: #ff9a3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 50% 45%, var(--bg-2), var(--bg-1) 70%);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .script { font-family: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive; }

  /* view switching */
  .view-intro, .view-cut, .view-explore, .view-inside { transition: opacity .5s ease; }
  body:not([data-view="intro"]) .view-intro,
  body:not([data-view="cut"]) .view-cut,
  body:not([data-view="explore"]) .view-explore,
  body[data-view="intro"] .view-inside { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }

  /* ---------- intro ---------- */
  #title { position: fixed; left: 50%; top: max(18px, 3vh); transform: translateX(-50%); width: min(88vw, 620px); height: auto; overflow: visible; pointer-events: none; }
  #introBottom { position: fixed; left: 0; right: 0; bottom: max(18px, 3vh); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; }
  #byline { width: min(62vw, 310px); height: auto; overflow: visible; }
  .ink-stroke { fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 1.2; }
  .ink-fill { fill: url(#inkGrad); filter: drop-shadow(0 1px 6px rgba(170, 195, 255, 0.22)); }
  .pen { fill: #fff; filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 16px #a9c4ff); opacity: 0; }

  .cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; pointer-events: auto; opacity: 0; transform: translateY(10px); transition: opacity .6s, transform .6s; }
  .cta.show { opacity: 1; transform: none; }
  .btn {
    border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 13px 26px; font-weight: 700; font-size: 15px; letter-spacing: .02em;
    background: rgba(12, 18, 38, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .15s, border-color .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.4); }
  .btn.primary { background: linear-gradient(135deg, #ffb05a, #ff7a2e); border-color: transparent; color: #26120a; box-shadow: 0 8px 30px rgba(255, 140, 50, 0.35); }
  .btn .ico { margin-right: 8px; }

  /* ---------- cut + explore chrome (kept minimal) ---------- */
  .corner-title { position: fixed; top: 26px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; line-height: 1; pointer-events: none; color: #fff; white-space: nowrap; }
  .back {
    position: fixed; top: 20px; left: 20px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .back:hover { background: rgba(255,255,255,0.1); }
  #bottomBar { position: fixed; left: 0; right: 0; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
  #bottomBar > * { pointer-events: auto; }
  .hint { font-size: 13px; color: var(--muted); padding: 7px 14px; border-radius: 999px; background: rgba(6,10,22,.55); border: 1px solid var(--line); transition: opacity .6s; }
  .hint.gone { opacity: 0; }
  .pill {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .pill.on { background: rgba(255,255,255,0.92); color: var(--bg-1); }
  #namesBtn { position: fixed; top: 20px; right: 20px; }

  /* ---------- nodes (tap to learn) ---------- */
  #nodes { position: fixed; inset: 0; pointer-events: none; }
  .node {
    position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; padding: 0;
    border: 2px solid rgba(255,255,255,0.95); background: var(--c, #fff); pointer-events: auto;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.12), 0 2px 10px rgba(0,0,0,0.45);
    transition: opacity .3s, transform .15s;
  }
  .node::after {
    content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--c, #fff); opacity: .7;
    animation: ping 2.2s ease-out infinite; pointer-events: none;
  }
  .node:hover, .node.on { transform: scale(1.25); }
  .node.on::after { animation-duration: 1.1s; }
  .node.far { opacity: .35; }
  .node.off { display: none; }
  .node .nm {
    position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
    white-space: nowrap; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 7px; color: #fff;
    background: rgba(7, 11, 24, 0.85); border: 1px solid var(--line); opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .node:hover .nm, body.names .node .nm { opacity: 1; }
  .node.edgeL .nm { left: -4px; transform: none; }
  .node.edgeR .nm { left: auto; right: -4px; transform: none; }
  .node.on .nm { opacity: 0; }
  @keyframes ping { 0% { transform: scale(.6); opacity: .8; } 80%, 100% { transform: scale(1.5); opacity: 0; } }

  /* little info bubble next to the tapped node */
  #pop {
    position: fixed; z-index: 5; width: 250px; padding: 14px 16px 15px; border-radius: 14px;
    background: rgba(10, 15, 32, 0.92); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
    opacity: 0; transform: scale(.94); transform-origin: left center; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  #pop.show { opacity: 1; transform: none; pointer-events: auto; }
  #pop.flip { transform-origin: right center; }
  #pop h3 { margin: 0 0 6px; font-weight: 700; font-size: 17px; letter-spacing: .01em; line-height: 1.2; color: #fff; display: flex; align-items: center; gap: 9px; padding-right: 18px; }
  #pop h3 .chip { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  #pop p { margin: 0; font-size: 14.5px; line-height: 1.5; color: #d3daf2; }
  #pop .x { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 7px; }

  /* ---------- swoosh + loader ---------- */
  #swoosh { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  #swoosh i {
    position: absolute; top: -30%; bottom: -30%; width: 70vw; left: -80vw; transform: skewX(-18deg);
    background: linear-gradient(90deg, transparent, rgba(160,190,255,0.10) 25%, rgba(160,190,255,0.5) 45%, rgba(255,255,255,0.95) 50%, rgba(255,170,80,0.5) 56%, rgba(255,170,80,0.08) 78%, transparent);
    filter: blur(6px); opacity: 0;
  }
  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255,230,190,.55), transparent 55%); opacity: 0; z-index: 19; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .6s; background: var(--bg-1); z-index: 30; }
  #loader .ring { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--orange); animation: spin 1s linear infinite; margin: 0 auto 14px; }
  #loader p { color: var(--muted); font-size: 14px; text-align: center; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { opacity: 0 !important; pointer-events: none !important; }

  @media (max-width: 760px) {
    .corner-title { font-size: 12px; top: 24px; letter-spacing: .16em; }
    .btn { padding: 12px 20px; font-size: 14px; }
    .back { top: 14px; left: 14px; } #namesBtn { top: 14px; right: 14px; }
    .node { width: 20px; height: 20px; margin: -10px 0 0 -10px; }
    .node .nm { font-size: 11px; padding: 2px 6px; }
    #pop { width: auto; left: 14px !important; right: 14px; top: auto !important; bottom: 84px; transform-origin: center bottom; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body data-view="intro">
<canvas id="scene"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f6ff"/>
      <stop offset="1" stop-color="#d9e1ff"/>
    </linearGradient>
  </defs>
</svg>

<!-- ================= INTRO ================= -->
<svg id="title" class="view-intro write" data-text="Animal Cell" data-size="190" data-dur="2600"></svg>
<div id="introBottom" class="view-intro">
  <svg id="byline" class="write" data-text="By Joseph" data-size="110" data-dur="1700"></svg>
  <div class="cta" id="introCta">
    <button class="btn primary" id="btnCut"><span class="ico">✂</span>Cut in half</button>
    <button class="btn" id="btnExplore">Explore the model</button>
  </div>
</div>

<!-- ================= CUT + EXPLORE (shared, minimal) ================= -->
<div class="corner-title view-inside">Animal Cell</div>
<button class="back view-inside" id="backBtn">← Back</button>
<button class="pill view-inside" id="namesBtn">Show names</button>
<div id="nodes" class="view-inside"></div>
<div id="bottomBar" class="view-inside">
  <div class="hint" id="hint">Tap a glowing dot to learn about that part</div>
  <div class="cta" id="cutCta"><button class="btn primary" id="cutToExplore">Explore the model</button></div>
</div>
<section id="pop" aria-live="polite">
  <button class="x" id="popClose" aria-label="Close">×</button>
  <h3><span class="chip" id="popChip"></span><span id="popTitle"></span></h3>
  <p id="popText"></p>
</section>

<div id="flash"></div>
<div id="swoosh"><i></i></div>
<div id="loader"><div><div class="ring"></div><p id="loadText">Growing the cell… 0%</p></div></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* =========================================================== content */
// One short sentence each, so it never feels like a wall of words.
const INFO = {
  "Nucleus": "The control center. It holds the cell's DNA.",
  "Nucleolus": "A dense spot inside the nucleus that makes ribosomes.",
  "Cell Membrane": "The outer skin. It controls what goes in and out.",
  "Cytoplasm": "The jelly that fills the cell and holds everything in place.",
  "Rough ER": "Folded sheets covered in ribosomes. They make proteins.",
  "Smooth ER": "Tubes with no ribosomes. They make fats.",
  "Ribosomes": "Tiny dots that build proteins.",
  "Golgi Body": "Packs proteins up and ships them where they need to go.",
  "Mitochondria": "The powerhouse. It turns food into energy.",
  "Lysosome": "The clean-up crew. It breaks down waste.",
  "Vacuoles/Vesicles": "Little bubbles that store and carry things.",
};
const NAME = { "Vacuoles/Vesicles": "Vesicles" };
const ORDER = ["Nucleus","Nucleolus","Rough ER","Smooth ER","Ribosomes","Golgi Body","Mitochondria","Lysosome","Vacuoles/Vesicles","Cytoplasm","Cell Membrane"];
const SHELL = new Set(["Cell Membrane", "Cytoplasm"]);
const R = 2.0;
let view = "intro", busy = false;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();

/* =========================================================== renderer */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 120);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 2.5;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.55;
controls.enablePan = false;

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(5, 8, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 1.0); rim.position.set(-6, 3, -5); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x1a1030, 0.6));

/* floating background specks */
const specks = [];
const dotTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.35, "rgba(255,255,255,0.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
for (const [n, size, color, op] of [[520, 0.09, 0x8fb3ff, 0.7], [160, 0.16, 0xffc48a, 0.55]]) {
  const g = new THREE.BufferGeometry(); const a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 6 + Math.random() * 16, t = Math.random() * 6.283, p = Math.acos(2 * Math.random() - 1);
    a.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)], i * 3);
  }
  g.setAttribute("position", new THREE.BufferAttribute(a, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size, map: dotTex, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(pts); specks.push(pts);
}

/* camera framing per view */
const VIEWS = {
  intro:   { pos: new THREE.Vector3(0, 1.5, 12.6), target: new THREE.Vector3(0, 0.15, 0) },
  cut:     { pos: new THREE.Vector3(0.6, 7.4, 6.4), target: new THREE.Vector3(0, -0.6, 0) },
  explore: { pos: new THREE.Vector3(5.6, 3.9, 5.6), target: new THREE.Vector3(0, 0, 0) },
};
camera.position.copy(VIEWS.intro.pos); controls.target.copy(VIEWS.intro.target);

function resize() {
  const w = window.innerWidth, h = window.innerHeight, tall = w / h < 0.8;
  renderer.setSize(w, h, true);   // also sets the canvas CSS size
  camera.aspect = w / h;
  camera.fov = tall ? 56 : 36;
  camera.updateProjectionMatrix();
  VIEWS.intro.pos.set(0, 1.5, tall ? 9.2 : 12.6);
  if (view === "intro" && !busy) camera.position.copy(VIEWS.intro.pos);
}
window.addEventListener("resize", resize); resize();

/* =========================================================== model helpers */
function kindOf(o) { let n = o; while (n) { if (n.userData && n.userData.organelle) return [n.userData.organelle, n]; n = n.parent; } return [null, null]; }

function register(root, { clip = null, solidShell = false } = {}) {
  const reg = { root, groups: {}, pickables: [] };
  root.traverse((o) => {
    if (!o.isMesh) return;
    const [kind, owner] = kindOf(o); if (!kind) return;
    o.material = o.material.clone();
    const m = o.material;
    m.envMapIntensity = 0.35;
    if (kind === "Cell Membrane") {
      m.envMapIntensity = 0.15; m.roughness = 0.6;
      if ("sheen" in m) m.sheen = 0;
      if ("specularIntensity" in m) m.specularIntensity = 0.25;
      if (solidShell) { m.transparent = false; m.opacity = 1; }
      else m.opacity = Math.min(1, m.opacity * 1.05);
    }
    if (kind === "Cytoplasm") m.opacity *= 0.8;
    if (clip) {
      m.clippingPlanes = clip; m.side = THREE.DoubleSide;
      // the inside of anything that got cut is drawn as a flat, solid cut face
      m.onBeforeCompile = (sh) => {
        sh.fragmentShader = sh.fragmentShader.replace("#include <dithering_fragment>",
          "#include <dithering_fragment>\n if (!gl_FrontFacing) gl_FragColor = vec4(linearToOutputTexel(vec4(diffuse * 0.78, 1.0)).rgb, gl_FragColor.a);");
      };
      m.customProgramCacheKey = () => "cutfill";
    }
    m.userData.baseOpacity = m.opacity;
    m.userData.baseEmissive = m.emissive.clone();
    m.userData.baseTransparent = m.transparent;
    m.depthWrite = !m.transparent;
    if (SHELL.has(kind)) o.renderOrder = kind === "Cell Membrane" ? 3 : 2;
    o.userData.kind = kind;
    const g = reg.groups[kind] || (reg.groups[kind] = { meshes: [], objects: new Set(), color: null });
    g.meshes.push(o); g.objects.add(owner);
    if (!g.color && !m.name.includes("Cristae") && !m.name.includes("Pore")) g.color = "#" + m.color.getHexString(THREE.SRGBColorSpace);
    reg.pickables.push(o);
  });
  for (const g of Object.values(reg.groups)) g.objects = [...g.objects];
  return reg;
}
function shellRadii(reg, kind) {
  let lo = Infinity, hi = 0;
  for (const m of reg.groups[kind].meshes) {
    if (m.material.name.includes("Pore")) continue;
    const p = m.geometry.attributes.position; const v = new THREE.Vector3();
    m.updateWorldMatrix(true, false);
    for (let i = 0; i < p.count; i++) { const l = v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld).length(); lo = Math.min(lo, l); hi = Math.max(hi, l); }
  }
  return [lo, hi];
}

/* =========================================================== loading */
const loadText = document.getElementById("loadText");
const prog = { full: 0, cut: 0 };
const loader = new GLTFLoader();
const loadGLB = (url, k) => new Promise((res, rej) => loader.load(url, res, (e) => {
  if (e.total) { prog[k] = e.loaded / e.total; loadText.textContent = `Growing the cell… ${Math.round((prog.full + prog.cut) * 50)}%`; }
}, rej));

let FULL = null, EX = null;
const OPEN = 1000;   // plane pushed far away = nothing is clipped
const clipBottom = [new THREE.Plane(new THREE.Vector3(0, -1, 0), OPEN)];
const clipTop = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0)];
const topLocalPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.003);
function setWhole(whole) {   // whole = one closed cell with no clipping at all
  clipBottom[0].constant = whole ? OPEN : 0;
  if (FULL) FULL.topGroup.visible = !whole;
}

Promise.all([loadGLB("animal_cell_full.glb", "full"), loadGLB("animal_cell.glb", "cut")]).then(([fullG, cutG]) => {
  const bottomRoot = fullG.scene;
  const topRoot = fullG.scene.clone(true);
  const topGroup = new THREE.Group(); topGroup.add(topRoot);
  const fullGroup = new THREE.Group(); fullGroup.add(bottomRoot, topGroup);
  scene.add(fullGroup);
  const bottom = register(bottomRoot, { clip: clipBottom, solidShell: true });
  const top = register(topRoot, { clip: clipTop, solidShell: true });

  const rims = new THREE.Group();
  const [mLo, mHi] = shellRadii(bottom, "Cell Membrane");
  const [nLo, nHi] = shellRadii(bottom, "Nucleus");
  for (const [lo, hi, col] of [[mLo, mHi, 0xff8a2a], [nLo, Math.min(nHi, nLo + 0.06), 0x8f7fe0]]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(lo, hi, 160), new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; rims.add(ring);
  }
  const topRims = rims.clone(); topRims.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  rims.position.y = -0.001; topRims.position.y = 0.001;
  fullGroup.add(rims); topGroup.add(topRims);
  rims.visible = topRims.visible = false;

  const laser = new THREE.Mesh(new THREE.TorusGeometry(mHi + 0.02, 0.018, 8, 200, 0.001),
    new THREE.MeshBasicMaterial({ color: 0xfff1c9, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  laser.rotation.x = Math.PI / 2; fullGroup.add(laser);
  const laserGlow = new THREE.PointLight(0xffb066, 0, 3); fullGroup.add(laserGlow);

  FULL = { group: fullGroup, bottom, top, topGroup, rims, topRims, laser, laserGlow, outerR: mHi };
  setWhole(true);

  EX = register(cutG.scene);
  scene.add(EX.root);
  EX.root.visible = false;

  nodesCut = new NodeSet(bottom, "cut");
  nodesEx = new NodeSet(EX, "explore");
  camera.position.copy(VIEWS.intro.pos); camera.lookAt(VIEWS.intro.target); controls.target.copy(VIEWS.intro.target); controls.update();
  document.getElementById("loader").classList.add("hidden");
  startIntro();
}).catch((err) => { loadText.textContent = "Couldn't load the 3D files. Make sure animal_cell.glb and animal_cell_full.glb are next to index.html."; console.error(err); });

/* =========================================================== cursive writing */
const SVGNS = "http://www.w3.org/2000/svg";
let uid = 0;
function prepareWriting(svg) {
  const text = svg.dataset.text, size = +svg.dataset.size, id = "w" + (uid++);
  svg.innerHTML = `
    <defs>
      <linearGradient id="${id}f" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
      <mask id="${id}ms" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
        <rect class="solid" x="-2000" y="-2000" width="0" height="6000" fill="#fff"/>
        <rect class="feather" x="0" y="-2000" width="60" height="6000" fill="url(#${id}f)"/>
      </mask>
      <mask id="${id}mf" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
        <rect class="solid" x="-2000" y="-2000" width="0" height="6000" fill="#fff"/>
        <rect class="feather" x="0" y="-2000" width="90" height="6000" fill="url(#${id}f)"/>
      </mask>
    </defs>
    <text class="script ink-stroke" x="0" y="0" font-size="${size}" mask="url(#${id}ms)">${text}</text>
    <text class="script ink-fill" x="0" y="0" font-size="${size}" mask="url(#${id}mf)">${text}</text>
    <circle class="pen" r="${size * 0.035}"/>`;
  const bb = svg.querySelector(".ink-fill").getBBox();
  const padX = size * 0.45, padY = size * 0.3;       // script letters swing past their box, give them room
  svg.setAttribute("viewBox", `${bb.x - padX} ${bb.y - padY} ${bb.width + padX * 2} ${bb.height + padY * 2}`);
  svg.style.aspectRatio = `${bb.width + padX * 2} / ${bb.height + padY * 2}`;
  return { bb, size, texts: [...svg.querySelectorAll("text")], ms: svg.querySelector(`#${id}ms`), mf: svg.querySelector(`#${id}mf`), pen: svg.querySelector(".pen") };
}
function setMask(mask, x) {
  mask.querySelector(".solid").setAttribute("width", Math.max(0, x + 2000));
  mask.querySelector(".feather").setAttribute("x", x);
}
function write(w, dur) {
  return new Promise((done) => {
    const { bb, size, ms, mf, pen } = w;
    const t0 = performance.now(), span = bb.width + size * 0.6;
    pen.style.opacity = 1;
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      const tt = Math.min(1, t + 0.025 * Math.sin(t * 23) * (1 - t));   // uneven, hand-written speed
      const x = bb.x - size * 0.3 + span * tt;
      setMask(ms, x); setMask(mf, x - size * 0.55);
      pen.setAttribute("cx", x);
      pen.setAttribute("cy", bb.y + bb.height * (0.5 + 0.26 * Math.sin(tt * 46) * Math.cos(tt * 13)));
      if (t < 1) return requestAnimationFrame(step);
      const t1 = performance.now();
      const settle = (n) => {
        const k = Math.min(1, (n - t1) / 450);
        setMask(mf, x - size * 0.55 + size * 1.2 * k); pen.style.opacity = 1 - k;
        if (k < 1) return requestAnimationFrame(settle);
        w.texts.forEach(t => t.removeAttribute("mask"));   // fully written: nothing can cut letters off
        done();
      };
      requestAnimationFrame(settle);
    };
    requestAnimationFrame(step);
  });
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let introWritten = false;
async function startIntro() {
  try { await document.fonts.load('100px "Great Vibes"'); } catch (e) {}
  const title = prepareWriting(document.getElementById("title"));
  const by = prepareWriting(document.getElementById("byline"));
  controls.autoRotate = true; controls.enableZoom = false;
  await sleep(450);
  await write(title, 2600);
  await sleep(250);
  await write(by, 1700);
  introWritten = true;
  document.getElementById("introCta").classList.add("show");
}

/* =========================================================== tweening */
const ease = (t) => t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2;
const easeOut = (t) => 1 - (1 - t) ** 3;
const tweens = new Set();
const tween = (dur, fn, e = ease) => new Promise((done) => tweens.add({ t0: performance.now(), dur, fn, e, done }));
function runTweens(now) {
  for (const tw of tweens) {
    const t = Math.min(1, (now - tw.t0) / tw.dur);
    tw.fn(tw.e(t), t);
    if (t >= 1) { tweens.delete(tw); tw.done(); }
  }
}
function moveCamera(to, dur = 1300) {
  const fp = camera.position.clone(), ft = controls.target.clone();
  return tween(dur, (k) => { camera.position.lerpVectors(fp, to.pos, k); controls.target.lerpVectors(ft, to.target, k); });
}
function setOpacity(reg, k) {
  for (const g of Object.values(reg.groups)) for (const m of g.meshes) {
    const mat = m.material;
    mat.transparent = k < 0.999 || mat.userData.baseTransparent;
    mat.opacity = mat.userData.baseOpacity * k;
    mat.depthWrite = !mat.transparent;
  }
}

/* =========================================================== views */
const hint = document.getElementById("hint");
function setView(v) {
  view = v; document.body.dataset.view = v;
  closePop();
  hint.classList.remove("gone");
  clearTimeout(setView.t); setView.t = setTimeout(() => hint.classList.add("gone"), 7000);
}
const nodesWrap = document.getElementById("nodes");
function showNodes(on) { nodesWrap.style.opacity = on ? 1 : 0; nodesWrap.style.transition = "opacity .5s"; }

/* ---- cut in half ---- */
document.getElementById("btnCut").addEventListener("click", async () => {
  if (busy || !FULL) return; busy = true;
  const { laser, laserGlow, topGroup, top, topRims, outerR } = FULL;
  document.getElementById("introCta").classList.remove("show");
  controls.autoRotate = false; controls.enabled = false;
  await moveCamera({ pos: new THREE.Vector3(0, 2.2, 10), target: new THREE.Vector3(0, 0, 0) }, 700);

  laser.material.opacity = 1; laserGlow.intensity = 6;
  await tween(900, (k) => {
    const arc = Math.max(0.001, k * Math.PI * 2);
    laser.geometry.dispose();
    laser.geometry = new THREE.TorusGeometry(outerR + 0.02, 0.02, 8, 200, arc);
    laserGlow.position.set(Math.cos(arc) * (outerR + 0.3), 0, -Math.sin(arc) * (outerR + 0.3));
  }, (t) => t);
  setWhole(false);
  FULL.rims.visible = topRims.visible = true;
  document.getElementById("flash").animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 420, easing: "ease-out" });
  await tween(260, (k, t) => { topGroup.position.x = Math.sin(t * 40) * 0.025 * (1 - t); laser.material.opacity = 1 - k; laserGlow.intensity = 6 * (1 - k); });
  topGroup.position.x = 0;

  showNodes(false);
  setView("cut");
  const fp = camera.position.clone(), ft = controls.target.clone();
  await tween(1900, (k, t) => {
    topGroup.position.y = 4.2 * k; topGroup.position.z = -1.2 * k; topGroup.rotation.x = -0.35 * k;
    const fade = Math.max(0, Math.min(1, (t - 0.35) / 0.55));
    setOpacity(top, 1 - fade);
    topRims.traverse(o => { if (o.isMesh) { o.material.transparent = true; o.material.opacity = 1 - fade; } });
    camera.position.lerpVectors(fp, VIEWS.cut.pos, k); controls.target.lerpVectors(ft, VIEWS.cut.target, k);
  });
  topGroup.visible = false;
  controls.enabled = true; controls.enableZoom = true;
  showNodes(true);
  document.getElementById("cutCta").classList.add("show");
  busy = false;
});

async function cutBackToIntro() {
  busy = true;
  showNodes(false);
  document.getElementById("cutCta").classList.remove("show");
  setView("intro");
  const { topGroup, top, topRims } = FULL;
  topGroup.visible = true;
  const camP = moveCamera(VIEWS.intro, 1500);
  await tween(1500, (k) => {
    topGroup.position.set(0, 4.2 * (1 - k), -1.2 * (1 - k));
    topGroup.rotation.x = -0.35 * (1 - k);
    setOpacity(top, k);
    topRims.traverse(o => { if (o.isMesh) o.material.opacity = k; });
  });
  await camP;
  setOpacity(top, 1);
  FULL.rims.visible = topRims.visible = false;
  topGroup.position.set(0, 0, 0); topGroup.rotation.set(0, 0, 0);
  setWhole(true);
  controls.autoRotate = true; controls.enableZoom = false;
  if (introWritten) document.getElementById("introCta").classList.add("show");
  busy = false;
}

/* ---- swoosh into the explore model ---- */
function swooshFx() {
  document.querySelector("#swoosh i").animate([
    { left: "-80vw", opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 1, offset: 0.75 }, { left: "110vw", opacity: 0 }
  ], { duration: 900, easing: "cubic-bezier(.55,.05,.35,1)" });
}
async function goExplore() {
  if (busy || !EX) return; busy = true;
  document.getElementById("introCta").classList.remove("show");
  document.getElementById("cutCta").classList.remove("show");
  showNodes(false); closePop();
  controls.autoRotate = false; controls.enabled = false;
  swooshFx();
  const g = FULL.group;
  await tween(520, (k) => { g.rotation.y = k * Math.PI * 1.2; g.scale.setScalar(1 + k * 0.5); setOpacity(FULL.bottom, 1 - k); setOpacity(FULL.top, 1 - k); }, (t) => t * t);
  g.visible = false; g.rotation.y = 0; g.scale.setScalar(1);
  setView("explore");
  EX.root.visible = true;
  EX.root.scale.setScalar(0.55); EX.root.rotation.y = -Math.PI * 0.9;
  camera.position.copy(VIEWS.explore.pos).multiplyScalar(1.15); controls.target.set(0, 0, 0);
  await tween(1000, (k) => { EX.root.scale.setScalar(0.55 + 0.45 * k); EX.root.rotation.y = -Math.PI * 0.9 * (1 - k); camera.position.copy(VIEWS.explore.pos).multiplyScalar(1.15 - 0.15 * k); }, easeOut);
  controls.enabled = true; controls.enableZoom = true; controls.autoRotate = true;
  showNodes(true);
  busy = false;
}
document.getElementById("btnExplore").addEventListener("click", goExplore);
document.getElementById("cutToExplore").addEventListener("click", goExplore);

async function exploreBackToIntro() {
  busy = true;
  showNodes(false);
  swooshFx();
  await tween(450, (k) => { EX.root.scale.setScalar(1 - 0.45 * k); EX.root.rotation.y = Math.PI * 0.9 * k; }, (t) => t * t);
  EX.root.visible = false; EX.root.rotation.y = 0; EX.root.scale.setScalar(1);
  const { group, topGroup, top, bottom, topRims } = FULL;
  group.visible = true; topGroup.position.set(0, 0, 0); topGroup.rotation.set(0, 0, 0);
  topRims.traverse(o => { if (o.isMesh) o.material.opacity = 1; });
  FULL.rims.visible = topRims.visible = false;
  setWhole(true);
  setOpacity(top, 1); setOpacity(bottom, 1);
  setView("intro");
  group.scale.setScalar(0.6);
  camera.position.copy(VIEWS.intro.pos); controls.target.copy(VIEWS.intro.target);
  await tween(800, (k) => group.scale.setScalar(0.6 + 0.4 * k), easeOut);
  controls.enabled = true; controls.autoRotate = true; controls.enableZoom = false;
  if (introWritten) document.getElementById("introCta").classList.add("show");
  busy = false;
}
document.getElementById("backBtn").addEventListener("click", () => {
  if (busy) return;
  if (view === "cut") cutBackToIntro(); else if (view === "explore") exploreBackToIntro();
});

/* =========================================================== nodes: tap to learn */
const namesBtn = document.getElementById("namesBtn");
namesBtn.addEventListener("click", () => {
  const on = document.body.classList.toggle("names");
  namesBtn.classList.toggle("on", on);
  namesBtn.textContent = on ? "Hide names" : "Show names";
});
let nodesCut = null, nodesEx = null;
const WEDGE = new THREE.Vector3(1, 1, 1).normalize();

class NodeSet {
  constructor(reg, mode) {
    this.reg = reg; this.mode = mode; this.items = []; this.taken = [];
    const home = VIEWS[mode];
    const toCam = home.pos.clone().sub(home.target).normalize();
    const order = ["Cell Membrane", "Cytoplasm", ...ORDER.filter(k => !SHELL.has(k))];
    for (const kind of order) {
      const g = reg.groups[kind]; if (!g) continue;
      const anchor = this.pickAnchor(kind, g, home, toCam);
      if (!anchor) continue;
      const sp = anchor.clone().project(camera);
      this.taken.push([sp.x * window.innerWidth / 2, sp.y * window.innerHeight / 2]);
      const el = document.createElement("button");
      el.className = "node off";
      el.style.setProperty("--c", g.color);
      el.setAttribute("aria-label", NAME[kind] || kind);
      el.innerHTML = `<span class="nm">${NAME[kind] || kind}</span>`;
      el.addEventListener("click", (e) => { e.stopPropagation(); openPop(kind, this); });
      nodesWrap.appendChild(el);
      this.items.push({ kind, el, anchor, color: g.color });
    }
  }
  // one fixed spot per part, chosen so it's easy to see from this view's starting camera
  pickAnchor(kind, g, home, toCam) {
    const flat = new THREE.Vector3(toCam.x, 0, toCam.z).normalize();
    const side = new THREE.Vector3(-flat.z, 0, flat.x);
    if (this.mode === "cut") {
      if (kind === "Cell Membrane") return side.clone().multiplyScalar(-0.8).add(flat.clone().multiplyScalar(0.6)).normalize().multiplyScalar(R - 0.035).setY(-0.01);
      if (kind === "Cytoplasm") return side.clone().multiplyScalar(0.7).add(flat.clone().multiplyScalar(0.5)).normalize().multiplyScalar(1.45).setY(-0.5);
      if (kind === "Nucleus") return side.clone().multiplyScalar(-0.5).add(flat.clone().multiplyScalar(-0.85)).normalize().multiplyScalar(0.72).setY(-0.01);
    } else {
      if (kind === "Cell Membrane") return new THREE.Vector3(-0.35, 0.55, 0.75).normalize().multiplyScalar(R);
      if (kind === "Cytoplasm") return new THREE.Vector3(1.05, -0.2, 1.4);
      if (kind === "Nucleus") return new THREE.Vector3(0.6, 0.75, 0.0).normalize().multiplyScalar(0.72).setZ(0.02);
    }
    // sample points on the part's surface, then keep the closest one the camera can actually see
    camera.position.copy(home.pos); camera.lookAt(home.target); camera.updateMatrixWorld(true);
    const pts = [];
    for (const mesh of g.meshes) {
      if (mesh.material.name.includes("Pore")) continue;
      const pos = mesh.geometry.attributes.position; mesh.updateWorldMatrix(true, false);
      const step = Math.max(1, Math.floor(pos.count / 400));
      for (let i = 0; i < pos.count; i += step) pts.push(new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld));
    }
    const ok = (p) => {
      if (this.mode === "cut" && p.y > -0.01) return false;
      const ndc = p.clone().project(camera);
      if (Math.abs(ndc.x) > 0.8 || Math.abs(ndc.y) > 0.8) return false;
      const sx = ndc.x * window.innerWidth / 2, sy = ndc.y * window.innerHeight / 2;
      const gap = Math.min(window.innerWidth, window.innerHeight) * (window.innerWidth < 760 ? 0.09 : 0.06);
      if (this.taken.some(([tx, ty]) => Math.hypot(sx - tx, sy - ty) < gap)) return false;   // keep dots apart
      return !this.blocked(p);
    };
    pts.sort((a, b) => a.distanceTo(home.pos) - b.distanceTo(home.pos));
    for (let i = 0; i < Math.min(pts.length, 160); i++) {
      // spread the search a little so dots don't all hug the front edge
      const p = pts[Math.min(pts.length - 1, Math.floor(i * pts.length / 160))];
      if (ok(p)) return p;
    }
    return pts.find(ok) || pts[0];
  }
  blocked(p) {
    const dir = p.clone().sub(camera.position); const d = dir.length();
    ray.set(camera.position, dir.normalize());
    const hit = ray.intersectObjects(this.reg.pickables, false).find(h =>
      h.object.userData.kind !== "Cytoplasm" &&
      (this.mode !== "explore" || h.object.userData.kind !== "Cell Membrane") &&   // see-through in explore
      (this.mode !== "cut" || h.point.y <= 0.01) &&
      (h.object.material.userData.baseOpacity > 0.5 || h.object.userData.kind === "Cell Membrane"));
    return hit ? hit.distance < d - 0.03 : false;
  }
  layout(frame) {
    const W = window.innerWidth, H = window.innerHeight;
    const camDir = camera.position.clone().sub(controls.target).normalize();
    for (const it of this.items) {
      const p = it.anchor.clone().project(camera);
      const x = (p.x * 0.5 + 0.5) * W, y = (-p.y * 0.5 + 0.5) * H;
      const facing = it.anchor.clone().normalize().dot(camDir);
      const off = p.z > 1 || x < 0 || x > W || y < 0 || y > H;
      it.el.classList.toggle("off", off);
      if (off) continue;
      it.el.style.left = x + "px"; it.el.style.top = y + "px";
      it.el.classList.toggle("edgeL", x < 70); it.el.classList.toggle("edgeR", x > W - 70);
      it.sx = x; it.sy = y;
      // dim dots on the far side of the cell (every few frames, cheap)
      if (frame % 6 === 0) it.el.classList.toggle("far", this.hidden(it, facing));
      it.el.classList.toggle("on", popKind === it.kind && popSet === this);
    }
  }
  hidden(it, facing) {
    if (it.kind === "Cell Membrane") return facing < 0.1;
    if (this.mode === "cut") return camera.position.y < 0.2;          // looking from underneath
    return facing < -0.25;                                             // on the far side of the cell
  }
  setVisible(on) { for (const it of this.items) it.el.style.display = on ? "" : "none"; }
}

/* ---- info bubble ---- */
const pop = document.getElementById("pop");
let popKind = null, popSet = null;
function setGlow(reg, kind, on) {
  const g = reg && reg.groups[kind]; if (!g) return;
  for (const m of g.meshes) {
    if (on) { m.material.emissive.set(g.color); m.material.emissiveIntensity = SHELL.has(kind) ? 0.12 : 0.4; }
    else { m.material.emissive.copy(m.material.userData.baseEmissive); m.material.emissiveIntensity = 1; }
  }
}
function openPop(kind, set) {
  if (popKind) setGlow(popSet.reg, popKind, false);
  popKind = kind; popSet = set;
  setGlow(set.reg, kind, true);
  const g = set.reg.groups[kind];
  document.getElementById("popChip").style.background = g.color;
  document.getElementById("popTitle").textContent = NAME[kind] || kind;
  document.getElementById("popText").textContent = INFO[kind];
  pop.classList.add("show");
  hint.classList.add("gone");
  controls.autoRotate = false;
  placePop();
}
function closePop() {
  if (popKind && popSet) setGlow(popSet.reg, popKind, false);
  popKind = null; popSet = null;
  pop.classList.remove("show");
}
function placePop() {
  if (!popKind || window.innerWidth < 760) return;
  const it = popSet.items.find(i => i.kind === popKind); if (!it || it.sx == null) return;
  const W = window.innerWidth, H = window.innerHeight, w = pop.offsetWidth, h = pop.offsetHeight;
  const flip = it.sx + 26 + w > W - 12;
  pop.classList.toggle("flip", flip);
  pop.style.left = (flip ? it.sx - 26 - w : it.sx + 26) + "px";
  pop.style.top = Math.min(H - h - 12, Math.max(70, it.sy - h / 2)) + "px";
}
document.getElementById("popClose").addEventListener("click", closePop);

/* clicking the 3D model itself also works */
function pick(ev) {
  const set = view === "cut" ? nodesCut : view === "explore" ? nodesEx : null;
  if (!set) return null;
  const r = canvas.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  let hits = ray.intersectObjects(set.reg.pickables, false).filter(h => h.object.visible && h.object.material.opacity > 0.05);
  if (view === "cut") hits = hits.filter(h => h.point.y <= 0.01);
  const h = hits.find(h => !SHELL.has(h.object.userData.kind)) || hits[0];
  return h ? [h.object.userData.kind, set] : null;
}
let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", (e) => {
  if (busy || view === "intro" || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const hit = pick(e);
  if (hit) openPop(hit[0], hit[1]); else closePop();
});
canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse" || e.buttons || view === "intro") return;
  canvas.style.cursor = pick(e) ? "pointer" : "grab";
});

/* =========================================================== loop */
let last = performance.now(), frame = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; frame++;
  runTweens(now);
  if (FULL) { FULL.topGroup.updateMatrixWorld(true); clipTop[0].copy(topLocalPlane).applyMatrix4(FULL.topGroup.matrixWorld); }
  for (let s = 0; s < specks.length; s++) {
    specks[s].rotation.y += dt * (0.01 + s * 0.008);
    specks[s].position.y = Math.sin(now / 4000 + s) * 0.3;
  }
  if (popKind && popSet && !SHELL.has(popKind)) {
    const k = 0.25 + 0.18 * Math.sin(now / 300);
    for (const m of popSet.reg.groups[popKind].meshes) m.material.emissiveIntensity = k;
  }
  controls.update();
  renderer.render(scene, camera);
  if (nodesCut) nodesCut.setVisible(view === "cut");
  if (nodesEx) nodesEx.setVisible(view === "explore");
  if (view === "cut" && nodesCut) nodesCut.layout(frame);
  if (view === "explore" && nodesEx) nodesEx.layout(frame);
  placePop();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
